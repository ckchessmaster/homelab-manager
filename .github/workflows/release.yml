name: Release & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.0.0 or v1.0.0).'
        required: true
        type: string
        default: '1.0.0'
      publish_release:
        description: 'Publish containers, agent binaries, and Helm chart (false = dry-run build & test).'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 0. Resolve & Validate Semantic Version (Narratible Pattern)
  # =========================================================================
  metadata:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - name: Resolve Version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ refs/tags/(v.+) ]]; then
            RELEASE_TAG="${BASH_REMATCH[1]}"
            SHOULD_PUBLISH="true"
          else
            REQUESTED_VERSION="${{ inputs.version }}"
            REQUESTED_VERSION="$(echo "$REQUESTED_VERSION" | xargs)"
            RELEASE_TAG="v${REQUESTED_VERSION#v}"
            SHOULD_PUBLISH="${{ inputs.publish_release }}"
          fi

          VERSION="${RELEASE_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$RELEASE_TAG'. Expected a semantic version such as v1.0.0 or 1.0.0."
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
          echo "Resolved Release Tag: $RELEASE_TAG (Version: $VERSION, Publish: $SHOULD_PUBLISH)"

  # =========================================================================
  # 1. CI Validation Gate: Comprehensive testing before any release action
  # =========================================================================
  test-backend:
    name: Test Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Backend Unit & Integration Tests
        run: dotnet test tests/ControlPlane.Api.Tests -c Release --no-build --verbosity normal

  test-agent:
    name: Test Node Agent (Go 1.22+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('src/agent/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Agent Unit Tests
        working-directory: src/agent
        run: go test -v -race ./...

  test-frontend:
    name: Test & Build Frontend (React 19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache NPM Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('src/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint Code (Oxlint)
        working-directory: src/frontend
        run: npm run lint

      - name: Typecheck and Build Distribution Assets
        working-directory: src/frontend
        run: npm run build

  test-helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: helm lint charts/controlplane

      - name: Validate Template Rendering
        run: helm template test-release charts/controlplane

  # =========================================================================
  # 2. Build & Package Artifacts: Containers, Node Agent Binaries, and Helm Chart
  # =========================================================================
  build-and-push-containers:
    name: Build & Publish OCI Images (GHCR)
    runs-on: ubuntu-latest
    needs: [metadata, test-backend, test-agent, test-frontend, test-helm]
    if: needs.metadata.outputs.should_publish == 'true'
    strategy:
      matrix:
        component:
          - name: controlplane-api
            dockerfile: docker/api/Dockerfile
          - name: controlplane-frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}:${{ needs.metadata.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}:latest

  package-agent-binaries:
    name: Build & Package Agent Binaries
    runs-on: ubuntu-latest
    needs: [metadata, test-backend, test-agent, test-frontend, test-helm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-Compile Matrix Binaries
        working-directory: src/agent
        run: |
          mkdir -p ../../dist/binaries
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="${{ needs.metadata.outputs.release_tag }}"
          
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o ../../dist/binaries/controlplane-agent-linux-amd64 ./cmd/agent
          tar -czvf ../../dist/controlplane-agent_${TAG}_linux_amd64.tar.gz -C ../../dist/binaries controlplane-agent-linux-amd64
          
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o ../../dist/binaries/controlplane-agent-linux-arm64 ./cmd/agent
          tar -czvf ../../dist/controlplane-agent_${TAG}_linux_arm64.tar.gz -C ../../dist/binaries controlplane-agent-linux-arm64
          
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o ../../dist/binaries/controlplane-agent-windows-amd64.exe ./cmd/agent
          zip -j ../../dist/controlplane-agent_${TAG}_windows_amd64.zip ../../dist/binaries/controlplane-agent-windows-amd64.exe

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum controlplane-agent_* > checksums.txt

      - name: Upload Agent Artifacts (Available in Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-agent-binaries
          path: |
            dist/controlplane-agent_*
            dist/checksums.txt
          retention-days: 7

  package-and-push-helm-chart:
    name: Package & Publish Helm Chart (GHCR)
    runs-on: ubuntu-latest
    needs: [metadata, test-backend, test-agent, test-frontend, test-helm]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Package Chart
        run: |
          mkdir -p dist/charts
          VERSION="${{ needs.metadata.outputs.version }}"
          helm package charts/controlplane --version "$VERSION" --app-version "$VERSION" --destination dist/charts

      - name: Upload Helm Chart Artifact (Available in Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: controlplane-helm-chart
          path: dist/charts/*.tgz
          retention-days: 7

      - name: Push Helm Chart OCI Artifact to GHCR
        if: needs.metadata.outputs.should_publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_LOWER="${{ github.repository_owner }}"
          VERSION="${{ needs.metadata.outputs.version }}"
          helm push "dist/charts/controlplane-${VERSION}.tgz" "oci://ghcr.io/${OWNER_LOWER,,}/charts"

  # =========================================================================
  # 3. Final Step: Publish GitHub Release (Only after ALL artifacts succeed)
  # =========================================================================
  publish-github-release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test-backend
      - test-agent
      - test-frontend
      - test-helm
      - build-and-push-containers
      - package-agent-binaries
      - package-and-push-helm-chart
    if: needs.metadata.outputs.should_publish == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Unified Assets Directory
        run: mkdir -p release-assets

      - name: Download Agent Binaries
        uses: actions/download-artifact@v4
        with:
          name: controlplane-agent-binaries
          path: release-assets

      - name: Download Helm Chart Package
        uses: actions/download-artifact@v4
        with:
          name: controlplane-helm-chart
          path: release-assets

      - name: Build Release Notes from CHANGELOG
        run: |
          TAG="${{ needs.metadata.outputs.release_tag }}"
          CHANGELOG_PATH="CHANGELOG.md"
          
          if [ -f "$CHANGELOG_PATH" ]; then
            python3 -c "import re, sys; c = open('$CHANGELOG_PATH').read(); m = re.search(r'(?ms)^##\s+' + re.escape('$TAG') + r'\b.*?(?=^##\s+|\Z)', c); open('release-notes.md', 'w').write(m.group(0).strip() + '\n') if m else sys.exit(1)" || echo "ControlPlane Release $TAG" > release-notes.md
          else
            echo "ControlPlane Release $TAG" > release-notes.md
          fi

      - name: Publish GitHub Release with All Attached Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.metadata.outputs.release_tag }}"
          
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ControlPlane $TAG" --notes-file release-notes.md
          fi
          
          # Upload all agent binaries, checksums, and the Helm chart .tgz together
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
