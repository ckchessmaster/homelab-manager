name: Release & Distribution

# NOTE: Automated triggers on version tags (v*.*.*) are kept commented out until ready to enable.
# To enable automated releases on tag creation, uncomment the following block:
# on:
#   push:
#     tags:
#       - 'v*.*.*'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  publish-containers:
    name: Build & Publish OCI Images (GHCR)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: controlplane-api
            dockerfile: docker/api/Dockerfile
          - name: controlplane-frontend
            dockerfile: docker/frontend/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}"
          echo "image=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  release-agent-binaries:
    name: Build & Package Agent Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Determine Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Cross-Compile Matrix Binaries
        working-directory: src/agent
        run: |
          mkdir -p ../../dist/binaries
          VERSION="${{ steps.version.outputs.version }}"
          
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o ../../dist/binaries/controlplane-agent-linux-amd64 ./cmd/agent
          tar -czvf ../../dist/controlplane-agent_${VERSION}_linux_amd64.tar.gz -C ../../dist/binaries controlplane-agent-linux-amd64
          
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o ../../dist/binaries/controlplane-agent-linux-arm64 ./cmd/agent
          tar -czvf ../../dist/controlplane-agent_${VERSION}_linux_arm64.tar.gz -C ../../dist/binaries controlplane-agent-linux-arm64
          
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o ../../dist/binaries/controlplane-agent-windows-amd64.exe ./cmd/agent
          zip -j ../../dist/controlplane-agent_${VERSION}_windows_amd64.zip ../../dist/binaries/controlplane-agent-windows-amd64.exe

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum controlplane-agent_* > checksums.txt

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ControlPlane Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/controlplane-agent_*
            dist/checksums.txt

  publish-helm-chart:
    name: Package & Publish Helm Chart (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Determine Version
        id: version
        run: |
          RAW_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Strip leading 'v' if present for SemVer Helm version
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Package Chart
        run: |
          mkdir -p dist/charts
          helm package charts/controlplane --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }} --destination dist/charts

      - name: Push Helm Chart OCI Artifact to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_LOWER="${{ github.repository_owner }}"
          helm push dist/charts/controlplane-${{ steps.version.outputs.version }}.tgz "oci://ghcr.io/${OWNER_LOWER,,}/charts"
