name: Continuous Integration

# NOTE: Automated triggers (push / pull_request) are kept commented out until ready to enable.
# To enable automated CI, uncomment the following block:
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-test:
    name: Backend (.NET 10 API & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Backend Unit & Integration Tests
        run: dotnet test tests/ControlPlane.Api.Tests -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: tests/ControlPlane.Api.Tests/TestResults/*.trx
          retention-days: 7

  agent-build:
    name: Node Agent (Go 1.22+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('src/agent/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Agent Unit Tests
        working-directory: src/agent
        run: go test -v -race ./...

      - name: Compile Static Daemon Binary
        working-directory: src/agent
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -v -o /tmp/controlplane-agent ./cmd/agent

  frontend-lint-and-typecheck:
    name: Frontend (React 19 & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache NPM Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('src/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint Code (Oxlint)
        working-directory: src/frontend
        run: npm run lint

      - name: Typecheck and Build Distribution Assets
        working-directory: src/frontend
        run: npm run build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: src/frontend
        run: npx playwright test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: helm lint charts/controlplane

      - name: Validate Template Rendering
        run: helm template test-release charts/controlplane
