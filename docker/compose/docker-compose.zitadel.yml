services:
  controlplane-zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: controlplane-zitadel
    restart: unless-stopped
    command:
      - start-from-init
      - --masterkeyFromEnv
      - --tlsMode
      - disabled
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_DATABASE_POSTGRES_HOST: controlplane-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DATABASE:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER:-controlplane}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-controlplane}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: "${ZITADEL_EXTERNAL_PORT:-8085}"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: "Automatically Initialized IAM_LOGIN_CLIENT"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2035-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_EXTERNAL_PORT:-8085}/ui/v2/login/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_EXTERNAL_PORT:-8085}/ui/v2/login/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_EXTERNAL_PORT:-8085}/ui/v2/login/logout?post_logout_redirect="
    volumes:
      - ./zitadel/bootstrap:/zitadel/bootstrap
    expose:
      - "8080"
    networks:
      - compose_controlplane-network
    depends_on:
      controlplane-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  controlplane-zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:latest
    container_name: controlplane-zitadel-login
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://controlplane-zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: "x-zitadel-instance-host:${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_EXTERNAL_PORT:-8085},x-zitadel-public-host:${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_EXTERNAL_PORT:-8085}"
    volumes:
      - ./zitadel/bootstrap:/zitadel/bootstrap:ro
    expose:
      - "3000"
    networks:
      - compose_controlplane-network
    depends_on:
      controlplane-zitadel:
        condition: service_healthy

  controlplane-zitadel-gateway:
    image: nginx:alpine
    container_name: controlplane-zitadel-gateway
    restart: unless-stopped
    ports:
      - "${ZITADEL_EXTERNAL_PORT:-8085}:8085"
    volumes:
      - ./zitadel/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - compose_controlplane-network
    depends_on:
      - controlplane-zitadel
      - controlplane-zitadel-login

networks:
  compose_controlplane-network:
    external: true
