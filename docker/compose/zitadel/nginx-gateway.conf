map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8085;

    location /ui/v2/login {
        proxy_pass http://controlplane-zitadel-login:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-zitadel-instance-host $http_host;
        proxy_set_header x-zitadel-public-host $http_host;
    }

    location / {
        proxy_pass http://controlplane-zitadel:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-zitadel-instance-host $http_host;
        proxy_set_header x-zitadel-public-host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
