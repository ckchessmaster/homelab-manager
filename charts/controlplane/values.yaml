# Default values for ControlPlane Helm Chart.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: ghcr.io/ckchessmaster/controlplane-api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is "v" + Chart.appVersion.
    tag: ""

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1654

  securityContext:
    runAsNonRoot: true
    runAsUser: 1654
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/ckchessmaster/controlplane-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is "v" + Chart.appVersion.
    tag: ""

  # Content Security Policy (CSP) scoping.
  # When zitadel.enabled is true, zitadel.authority is automatically included in connect-src and frame-src.
  csp:
    # Additional origins allowed in connect-src (e.g. Sentry, external metrics, custom APIs)
    extraConnectSrc: []
    # Additional origins allowed in frame-src (e.g. iframe auth providers)
    extraFrameSrc: []

  # Full CSP header override (if non-empty, this string overrides the automatically generated policy above)
  contentSecurityPolicy: ""

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101

  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  # Connection details for PostgreSQL
  host: "controlplane-postgres"
  port: 5432
  database: "controlplane"
  username: "controlplane"
  password: "controlplane_prod_secret"
  # If specified, secrets are loaded from this existing Secret instead of chart-managed secret
  existingSecret: ""
  # Or reference a specific secret name containing the database password/credentials (e.g. from CloudNativePG)
  passwordSecretName: ""

temporal:
  enabled: true
  address: "controlplane-temporal:7233"
  serverUrl: ""
  namespace: "homelab-manager"
  taskQueue: "homelab-manager-tasks"
  # Option: Load secrets from an existing Kubernetes Secret (e.g. existingSecret: temporal-db-secret)
  existingSecret: ""
  auth:
    enabled: false
    tokenUrl: "https://auth.chriskingdon.com/oauth/v2/token"
    clientId: ""
    # Provide clientSecret directly (stored in chart-managed Secret):
    clientSecret: ""
    # Or reference an existing Kubernetes Secret containing the client secret:
    existingSecret: ""
    secretRef:
      name: ""
      key: "clientSecret"
    scopes: "openid urn:zitadel:iam:org:projects:roles"

zitadel:
  enabled: false
  authority: "http://localhost:8085"
  # SPA Client ID used by the UI for PKCE authentication (defaults to audience if empty)
  clientId: ""
  # JWT token audience validation (can match clientId or project ID)
  audience: ""
  requireHttpsMetadata: true
  # Custom Role Mapping: Map raw IdP roles or groups to ControlPlane canonical roles
  roles:
    admin:
      - "admin"
    operator:
      - "operator"
    viewer:
      - "viewer"

auth:
  apiKey: "cp_prod_sample_secret_key_change_in_production"
  # Or reference an existing Secret for apiKey:
  apiKeySecretRef:
    name: ""
    key: "apiKey"

  # 256-bit Base64 master key for secret encryption (generate with: openssl rand -base64 32)
  masterKey: "uW51nK3F+sJmB1VjWqY1h9F9T7dM3XkC4b2L6r9p8E8="
  # Or reference an existing Secret for masterKey:
  masterKeySecretRef:
    name: ""
    key: "masterKey"

  # If specified, all credentials are loaded from this single existing Secret instead of chart-managed Secret
  existingSecret: ""

# Root-level existing secret mounted to the API deployment (e.g. existingSecret: temporal-db-secret)
existingSecret: ""

mcp:
  enabled: true

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
  hosts:
    - host: controlplane.homelab.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: api
        - path: /hubs
          pathType: Prefix
          service: api
        - path: /agent-hub
          pathType: Prefix
          service: api
  tls:
    - secretName: controlplane-tls
      hosts:
        - controlplane.homelab.local

networkPolicy:
  enabled: true
  # Egress CIDR subnets allowed for homelab nodes, hypervisors, and BMCs
  allowedEgressSubnets:
    - "192.168.0.0/16"
    - "10.0.0.0/8"
