apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "controlplane.configMapName" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  ENABLE_MCP_SERVER: {{ .Values.mcp.enabled | quote }}
  {{- if .Values.hubUrl }}
  ControlPlane__HubUrl: {{ .Values.hubUrl | quote }}
  {{- else if and .Values.ingress.enabled .Values.ingress.hosts }}
  {{- $firstHost := index .Values.ingress.hosts 0 }}
  {{- $proto := ternary "wss" "ws" (not (empty .Values.ingress.tls)) }}
  ControlPlane__HubUrl: {{ printf "%s://%s/agent-hub" $proto $firstHost.host | quote }}
  {{- end }}
  Database__Host: {{ .Values.database.host | quote }}
  Database__Port: {{ .Values.database.port | quote }}
  Database__Database: {{ .Values.database.database | quote }}
  Database__Username: {{ .Values.database.username | quote }}
  Temporal__Enabled: {{ .Values.temporal.enabled | quote }}
  Temporal__Address: {{ .Values.temporal.address | default .Values.temporal.serverUrl | quote }}
  Temporal__ServerUrl: {{ .Values.temporal.serverUrl | default .Values.temporal.address | quote }}
  Temporal__Namespace: {{ .Values.temporal.namespace | quote }}
  Temporal__TaskQueue: {{ .Values.temporal.taskQueue | quote }}
  {{- if and .Values.temporal.auth .Values.temporal.auth.enabled }}
  Temporal__Auth__Enabled: {{ .Values.temporal.auth.enabled | quote }}
  Temporal__Auth__TokenUrl: {{ .Values.temporal.auth.tokenUrl | quote }}
  Temporal__Auth__ClientId: {{ .Values.temporal.auth.clientId | quote }}
  Temporal__Auth__Scopes: {{ .Values.temporal.auth.scopes | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  Oidc__Authority: {{ .Values.oidc.issuerUrl | default .Values.oidc.authority | quote }}
  Oidc__ClientId: {{ .Values.oidc.clientId | default .Values.oidc.audience | default "controlplane" | quote }}
  Oidc__Audience: {{ .Values.oidc.audience | default .Values.oidc.clientId | default "controlplane" | quote }}
  Oidc__DisplayName: {{ .Values.oidc.displayName | default "Single Sign-On" | quote }}
  Oidc__RoleClaimType: {{ .Values.oidc.roleClaimType | default "groups" | quote }}
  Oidc__NameClaimType: {{ .Values.oidc.nameClaimType | default "preferred_username" | quote }}
  Oidc__Scope: {{ .Values.oidc.scope | default "openid profile email groups" | quote }}
  Oidc__RequireHttpsMetadata: {{ .Values.oidc.requireHttpsMetadata | quote }}
  {{- if .Values.oidc.roles }}
  {{- range $i, $role := .Values.oidc.roles.admin }}
  Oidc__Roles__Admin__{{ $i }}: {{ $role | quote }}
  {{- end }}
  {{- range $i, $role := .Values.oidc.roles.operator }}
  Oidc__Roles__Operator__{{ $i }}: {{ $role | quote }}
  {{- end }}
  {{- range $i, $role := .Values.oidc.roles.viewer }}
  Oidc__Roles__Viewer__{{ $i }}: {{ $role | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
