{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controlplane.secretName" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.database.password (not (or .Values.database.existingSecret .Values.database.passwordSecretName)) }}
  ConnectionStrings__ControlPlaneDatabase: {{ printf "Host=%s;Port=%d;Database=%s;Username=%s;Password=%s" .Values.database.host (.Values.database.port | int) .Values.database.database .Values.database.username .Values.database.password | b64enc | quote }}
  {{- end }}
  {{- if and (not (and .Values.auth.apiKeySecretRef .Values.auth.apiKeySecretRef.name)) .Values.auth.apiKey }}
  ControlPlane__ApiKey: {{ .Values.auth.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not (and .Values.auth.masterKeySecretRef .Values.auth.masterKeySecretRef.name)) .Values.auth.masterKey }}
  CONTROLPLANE_MASTER_KEY: {{ .Values.auth.masterKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.temporal.auth .Values.temporal.auth.enabled (not (and .Values.temporal.auth.secretRef .Values.temporal.auth.secretRef.name)) .Values.temporal.auth.clientSecret }}
  Temporal__Auth__ClientSecret: {{ .Values.temporal.auth.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
