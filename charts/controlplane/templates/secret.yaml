{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controlplane.secretName" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
type: Opaque
data:
  ConnectionStrings__ControlPlaneDatabase: {{ printf "Host=%s;Port=%d;Database=%s;Username=%s;Password=%s" .Values.database.host (.Values.database.port | int) .Values.database.database .Values.database.username .Values.database.password | b64enc | quote }}
  ControlPlane__ApiKey: {{ .Values.auth.apiKey | b64enc | quote }}
  CONTROLPLANE_MASTER_KEY: {{ .Values.auth.masterKey | b64enc | quote }}
{{- end }}
