{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "controlplane.fullname" . }}-api-netpol
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "controlplane.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from within the cluster (frontend, ingress controllers, monitoring)
    - from:
        - podSelector:
            matchLabels:
              {{- include "controlplane.frontend.selectorLabels" . | nindent 14 }}
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow in-cluster egress (PostgreSQL, Temporal, Kubernetes API server, etc.)
    - to:
        - namespaceSelector: {}
    # Allow outbound HTTPS/HTTP for external services (Zitadel OIDC, OCI Helm registries, Webhooks)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Allow communication to designated homelab infrastructure subnets (Proxmox, iDRAC, UniFi, OPNsense)
    {{- range .Values.networkPolicy.allowedEgressSubnets }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "controlplane.fullname" . }}-frontend-netpol
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      {{- include "controlplane.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from any source (managed by Ingress Controller)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to API pods
    - to:
        - podSelector:
            matchLabels:
              {{- include "controlplane.api.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
